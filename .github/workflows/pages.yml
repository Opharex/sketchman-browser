name: Deploy Sketchman to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Expand initial source archive
        if: hashFiles('sketchman-source.zip') != ''
        run: |
          unzip -q sketchman-source.zip -d /tmp/sketchman-import
          rsync -a --exclude=.github /tmp/sketchman-import/sketchman-browser/ ./
          git rm sketchman-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist tests tools README.md LICENSE-CODE.txt package.json .gitignore
          git commit -m "Expand Sketchman source into editable project files"
          git push origin HEAD:main
  deploy:
    needs: import
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sprite atlas builder dependencies
        run: python -m pip install Pillow==11.3.0
      - name: Build nine complete reskin atlases and matching thumbnails
        run: python tools/build-skins.py --dist dist --out dist/skins/generated
      - name: Verify JavaScript
        run: npm run check
      - name: Run gameplay and asset tests
        run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
